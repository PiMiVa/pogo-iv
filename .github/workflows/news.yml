# Holt stündlich die News von Pokémon GO Hub und den Event-Kalender, übersetzt Überschriften und
# Event-Namen ins Deutsche und legt alles als news.json ab (Skript: .github/scripts/news.py).
# App und Web-App lesen diese Datei (der Browser darf den Feed nicht direkt laden).
# Abschalten: diese Datei löschen oder unter "Actions" deaktivieren.
name: News aktualisieren
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: News laden und übersetzen
        run: python .github/scripts/news.py
      - name: Nur bei Änderung speichern
        run: |
          if git diff --quiet -- news.json && git ls-files --error-unmatch news.json >/dev/null 2>&1; then echo "Keine neuen News"; exit 0; fi
          git config user.name "Pogo IV"
          git config user.email "actions@users.noreply.github.com"
          git add news.json
          git commit -m "News aktualisiert"
          git pull --rebase
          git push
