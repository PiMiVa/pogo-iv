# Holt stündlich den News-Feed von Pokémon GO Hub und legt ihn als news.xml ab.
# Die Web-App liest diese Kopie (der Browser darf den Feed nicht direkt laden).
# Abschalten: diese Datei löschen oder unter "Actions" deaktivieren.
name: News aktualisieren
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Feed laden
        run: |
          curl -sf -A "Mozilla/5.0 (Pogo IV news mirror)" https://pokemongohub.net/feed/ -o news.new
          grep -q "<item>" news.new
          mv news.new news.xml
      - name: Nur bei Änderung speichern
        run: |
          if git diff --quiet -- news.xml; then echo "Keine neuen News"; exit 0; fi
          git config user.name "Pogo IV"
          git config user.email "actions@users.noreply.github.com"
          git add news.xml
          git commit -m "News aktualisiert"
          git push
